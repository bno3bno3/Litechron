buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
        classpath 'org.jetbrains.compose:compose-gradle-plugin:1.7.1'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    def sharedBuildDir = rootProject.file("${rootProject.buildDir}/${project.name}")
    // AGP generates unit-test paths relative to each plugin's source directory.
    // Windows cannot relativize a Pub plugin on C: against build outputs on D:.
    // Keep cross-drive outputs beside the plugin, isolated for this checkout.
    if (project.projectDir.toPath().root != sharedBuildDir.toPath().root) {
        def checkoutId = Integer.toHexString(rootProject.projectDir.canonicalPath.hashCode())
        project.buildDir = new File(project.projectDir, "build/litechron-${checkoutId}")
    } else {
        project.buildDir = sharedBuildDir
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
    delete subprojects.collect { it.buildDir }
}
