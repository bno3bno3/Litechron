org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true

# Kotlin's incremental cache cannot relativize Pub sources on C: against this
# project on D: ("this and base files have different roots"). Gradle still skips
# up-to-date tasks; only Kotlin's per-source incremental compilation is disabled.
kotlin.incremental=false
