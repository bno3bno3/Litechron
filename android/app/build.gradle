plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// 发布签名：android/key.properties 与 *.jks 不进仓库，缺失时退回 debug 签名
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace 'io.github.bno3bno3.litechron'
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true
        applicationId "io.github.bno3bno3.litechron"
        minSdkVersion 28
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Keep the production ID stable; development installs alongside it.
    flavorDimensions "environment"
    productFlavors {
        production {
            dimension "environment"
            manifestPlaceholders = [appLabel: "Litechron", appScheme: "litechron"]
            resValue "string", "app_link_scheme", "litechron"
        }
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [appLabel: "Litechron 测试", appScheme: "litechron-dev"]
            resValue "string", "app_link_scheme", "litechron-dev"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            proguardFiles 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testTemp = rootProject.file('../temp/ecard-tests')
            systemProperty 'java.io.tmpdir', testTemp.absolutePath
            doFirst { testTemp.mkdirs() }
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.work:work-testing:2.9.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.window:window-java:1.3.0'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation "androidx.glance:glance:1.1.1"
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    // For flutter_secure_storage
    implementation 'com.google.errorprone:error_prone_annotations:2.36.0'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // For preview
    implementation 'androidx.glance:glance-appwidget-preview:1.1.1'
    implementation "androidx.glance:glance-preview:1.1.1"
}
